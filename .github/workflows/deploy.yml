name: PROPIQ AI - CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  ACR_SERVER: proai.azurecr.io
  APP_IMAGE: proai.azurecr.io/propiq-app
  RESOURCE_GROUP: propiq-rg
  CONTAINER_APP_ENV: propiq-env
  CONTAINER_APP_NAME: propiq-app

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install backend dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov aiosqlite
      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  build-and-push:
    name: Build, push, and deploy unified image
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
      AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
      AZURE_SEARCH_KEY: ${{ secrets.AZURE_SEARCH_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
      POWERBI_EMBED_URL: ${{ secrets.POWERBI_EMBED_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push unified app image
        run: |
          docker build -t ${{ env.APP_IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.APP_IMAGE }}:${{ github.sha }}
          docker push ${{ env.APP_IMAGE }}:latest

      - name: Validate Azure deploy credentials
        shell: bash
        run: |
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "::error::Missing AZURE_CREDENTIALS GitHub secret. Image was pushed, but the Container App cannot be updated."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy unified image to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            secret_args=()
            env_args=(
              "APP_ENV=production"
              "DEBUG=false"
              "DATABASE_FALLBACK_SQLITE=true"
              "SEED_DEMO_USERS=true"
              "DEMO_USER_EMAIL=test@propiq.ai"
              "DEMO_USER_EMAIL_ALIASES=test@testprop.ai"
              "DEMO_USER_PASSWORD=test123"
              "USE_LOCAL_LLM=false"
              "AZURE_BLOB_CONTAINER_IMAGES=property-images"
              "AZURE_BLOB_CONTAINER_DEEDS=deed-documents"
            )

            add_secret_env() {
              local env_name="$1"
              local secret_name="$2"
              local value="${!env_name:-}"
              if [ -n "$value" ]; then
                secret_args+=("${secret_name}=${value}")
                env_args+=("${env_name}=secretref:${secret_name}")
              fi
            }

            add_secret_env DATABASE_URL database-url
            add_secret_env MONGODB_URI mongodb-uri
            add_secret_env REDIS_URL redis-url
            add_secret_env JWT_SECRET jwt-secret
            add_secret_env CORS_ORIGINS cors-origins
            add_secret_env AZURE_OPENAI_ENDPOINT azure-openai-endpoint
            add_secret_env AZURE_OPENAI_KEY azure-openai-key
            add_secret_env AZURE_OPENAI_API_VERSION azure-openai-api-version
            add_secret_env AZURE_OPENAI_DEPLOYMENT azure-openai-deployment
            add_secret_env AZURE_OPENAI_EMBEDDING_DEPLOYMENT azure-openai-embedding-deployment
            add_secret_env AZURE_STORAGE_CONNECTION_STRING azure-storage-connection-string
            add_secret_env AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT azure-document-intelligence-endpoint
            add_secret_env AZURE_DOCUMENT_INTELLIGENCE_KEY azure-document-intelligence-key
            add_secret_env AZURE_SEARCH_ENDPOINT azure-search-endpoint
            add_secret_env AZURE_SEARCH_KEY azure-search-key
            add_secret_env GOOGLE_PLACES_API_KEY google-places-api-key
            add_secret_env ELEVENLABS_API_KEY elevenlabs-api-key
            add_secret_env ELEVENLABS_VOICE_ID elevenlabs-voice-id
            add_secret_env ELEVENLABS_MODEL_ID elevenlabs-model-id
            add_secret_env POWERBI_EMBED_URL powerbi-embed-url

            if [ "${#secret_args[@]}" -gt 0 ]; then
              az containerapp secret set \
                --name "${{ env.CONTAINER_APP_NAME }}" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --secrets "${secret_args[@]}"
            fi

            az containerapp registry set \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --server "${{ env.ACR_SERVER }}" \
              --username "$ACR_USERNAME" \
              --password "$ACR_PASSWORD"

            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ env.APP_IMAGE }}:${{ github.sha }}" \
              --set-env-vars "${env_args[@]}"

            az containerapp ingress enable \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --type external \
              --target-port 80 \
              --transport auto
